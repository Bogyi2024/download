name: PikPak Auto Download

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'PikPak email'
        required: true
        type: string
      
      password:
        description: 'PikPak password (leave empty to use secret)'
        required: false
        type: string
      
      filename:
        description: 'Specific file to download (leave empty for first file)'
        required: false
        type: string

  schedule:
    - cron: '0 2 * * *'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
      
      - name: Run download script
        env:
          PIKPAK_EMAIL: ${{ github.event.inputs.email || secrets.PIKPAK_EMAIL }}
          PIKPAK_PASSWORD: ${{ github.event.inputs.password || secrets.PIKPAK_PASSWORD }}
          PIKPAK_FILE_NAME: ${{ github.event.inputs.filename || secrets.PIKPAK_FILE_NAME }}
        run: |
          cat > download.py << 'EOF'
          import os
          import asyncio
          from playwright.async_api import async_playwright
          from pathlib import Path

          EMAIL = os.environ.get("PIKPAK_EMAIL")
          PASSWORD = os.environ.get("PIKPAK_PASSWORD")
          TARGET_FILE = os.environ.get("PIKPAK_FILE_NAME", "")
          DOWNLOAD_DIR = Path("./downloads")
          DOWNLOAD_DIR.mkdir(exist_ok=True)

          async def download_from_pikpak():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(accept_downloads=True, viewport={"width": 1920, "height": 1080})
                  page = await context.new_page()
                  
                  try:
                      print("Navigating to PikPak drive...")
                      # FIXED: Use /drive/ URL which has the login page
                      await page.goto("https://mypikpak.com/drive/", wait_until="networkidle")
                      
                      # Wait for login form to appear
                      print("Waiting for login form...")
                      await page.wait_for_selector('input[type="text"], input[type="email"], input[name="email"], input[placeholder*="email" i], input[placeholder*="账号" i], input[placeholder*="邮箱" i]', timeout=15000)
                      
                      # Try multiple selectors for email input
                      email_selectors = [
                          'input[type="email"]',
                          'input[type="text"]',
                          'input[name="email"]',
                          'input[name="username"]',
                          'input[placeholder*="email" i]',
                          'input[placeholder*="账号" i]',
                          'input[placeholder*="邮箱" i]',
                          'input[placeholder*="mail" i]',
                      ]
                      
                      email_filled = False
                      for selector in email_selectors:
                          try:
                              if await page.is_visible(selector, timeout=2000):
                                  await page.fill(selector, EMAIL)
                                  print(f"Filled email using: {selector}")
                                  email_filled = True
                                  break
                          except:
                              continue
                      
                      if not email_filled:
                          # Last resort: fill first text input
                          await page.locator('input').first.fill(EMAIL)
                          print("Filled first input as email")
                      
                      # Try multiple selectors for password input
                      password_selectors = [
                          'input[type="password"]',
                          'input[name="password"]',
                          'input[placeholder*="password" i]',
                          'input[placeholder*="密码" i]',
                      ]
                      
                      password_filled = False
                      for selector in password_selectors:
                          try:
                              if await page.is_visible(selector, timeout=2000):
                                  await page.fill(selector, PASSWORD)
                                  print(f"Filled password using: {selector}")
                                  password_filled = True
                                  break
                          except:
                              continue
                      
                      if not password_filled:
                          raise Exception("Could not find password input")
                      
                      # Click login button
                      login_btn_selectors = [
                          'button[type="submit"]',
                          'button:has-text("Sign in")',
                          'button:has-text("Login")',
                          'button:has-text("Log in")',
                          'button:has-text("登录")',
                          'button:has-text("Sign In")',
                          '.login-btn',
                          '[data-testid="login-button"]',
                      ]
                      
                      btn_clicked = False
                      for selector in login_btn_selectors:
                          try:
                              if await page.is_visible(selector, timeout=2000):
                                  await page.click(selector)
                                  print(f"Clicked login button: {selector}")
                                  btn_clicked = True
                                  break
                          except:
                              continue
                      
                      if not btn_clicked:
                          # Try pressing Enter
                          await page.keyboard.press("Enter")
                          print("Pressed Enter to submit")
                      
                      # Wait for drive to load
                      print("Waiting for drive to load...")
                      await page.wait_for_selector(".file-list, .drive-item, [data-testid='file-list'], .file-item, .grid-item", timeout=30000)
                      print("Logged in successfully!")
                      
                      # Search for specific file if provided
                      if TARGET_FILE:
                          print(f"Searching for: {TARGET_FILE}")
                          search_selectors = [
                              'input[placeholder*="search" i]',
                              'input[type="search"]',
                              'input[placeholder*="搜索" i]',
                          ]
                          for selector in search_selectors:
                              try:
                                  if await page.is_visible(selector, timeout=2000):
                                      await page.fill(selector, TARGET_FILE)
                                      await page.keyboard.press("Enter")
                                      await asyncio.sleep(2)
                                      break
                              except:
                                  continue
                      
                      # Download file
                      print("Starting download...")
                      async with page.expect_download(timeout=120000) as download_info:
                          if TARGET_FILE:
                              file_selectors = [
                                  f'.file-item:has-text("{TARGET_FILE}")',
                                  f'.drive-item:has-text("{TARGET_FILE}")',
                                  f'.grid-item:has-text("{TARGET_FILE}")',
                                  f'[title="{TARGET_FILE}"]',
                              ]
                              for selector in file_selectors:
                                  try:
                                      if await page.is_visible(selector, timeout=2000):
                                          await page.click(selector)
                                          break
                                  except:
                                      continue
                          else:
                              # Click first file
                              first_file_selectors = [
                                  ".file-item:first-child",
                                  ".drive-item:first-child", 
                                  ".grid-item:first-child",
                                  ".file-list > div:first-child",
                              ]
                              for selector in first_file_selectors:
                                  try:
                                      if await page.is_visible(selector, timeout=2000):
                                          await page.click(selector)
                                          break
                                  except:
                                      continue
                          
                          # Click download button
                          dl_selectors = [
                              'button:has-text("Download")',
                              'button:has-text("下载")',
                              '[aria-label="download"]',
                              '.download-btn',
                              '[data-testid="download"]',
                          ]
                          for selector in dl_selectors:
                              try:
                                  if await page.is_visible(selector, timeout=2000):
                                      await page.click(selector)
                                      break
                              except:
                                  continue
                      
                      download = await download_info.value
                      save_path = DOWNLOAD_DIR / download.suggested_filename
                      await download.save_as(save_path)
                      print(f"Downloaded: {save_path}")
                      
                      files = list(DOWNLOAD_DIR.glob("*"))
                      print(f"Files in downloads: {[f.name for f in files]}")
                      
                  except Exception as e:
                      print(f"Error: {e}")
                      await page.screenshot(path="error_screenshot.png")
                      # Also save page HTML for debugging
                      html = await page.content()
                      with open("page_debug.html", "w", encoding="utf-8") as f:
                          f.write(html)
                      raise
                  finally:
                      await browser.close()

          if __name__ == "__main__":
              if not EMAIL or not PASSWORD:
                  raise ValueError("PIKPAK_EMAIL and PIKPAK_PASSWORD required!")
              asyncio.run(download_from_pikpak())
          EOF
          python download.py
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-artifacts
          path: |
            ./downloads/
            error_screenshot.png
            page_debug.html
          retention-days: 7
