name: PikPak Auto Download

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'PikPak email'
        required: true
        type: string
      
      password:
        description: 'PikPak password (leave empty to use secret)'
        required: false
        type: string
      
      filename:
        description: 'Specific file to download (leave empty for first file)'
        required: false
        type: string

  schedule:
    - cron: '0 2 * * *'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install PikPakApi aiohttp
      
      - name: Run download script
        env:
          PIKPAK_EMAIL: ${{ github.event.inputs.email || secrets.PIKPAK_EMAIL }}
          PIKPAK_PASSWORD: ${{ github.event.inputs.password || secrets.PIKPAK_PASSWORD }}
          PIKPAK_FILE_NAME: ${{ github.event.inputs.filename || secrets.PIKPAK_FILE_NAME }}
        run: |
          cat > download.py << 'EOF'
          import os
          import asyncio
          from pathlib import Path
          from pikpakapi import PikPakApi
          import aiohttp

          EMAIL = os.environ.get("PIKPAK_EMAIL")
          PASSWORD = os.environ.get("PIKPAK_PASSWORD")
          TARGET_FILE = os.environ.get("PIKPAK_FILE_NAME", "").strip()
          DOWNLOAD_DIR = Path("./downloads")
          DOWNLOAD_DIR.mkdir(exist_ok=True)

          async def download_from_pikpak():
              if not EMAIL or not PASSWORD:
                  raise ValueError("PIKPAK_EMAIL and PIKPAK_PASSWORD required!")

              print(f"Logging in as {EMAIL}...")
              client = PikPakApi(username=EMAIL, password=PASSWORD)
              await client.login()
              print("Login successful!")

              print("Fetching file list...")
              file_list = await client.file_list(parent_id="")
              files = file_list.get("files", [])
              
              if not files:
                  print("No files found in your PikPak drive.")
                  return

              print(f"Found {len(files)} files:")
              for f in files:
                  print(f"  - {f.get('name')}")

              # Select target file
              target = None
              if TARGET_FILE:
                  for f in files:
                      if f.get("name") == TARGET_FILE:
                          target = f
                          break
                  if not target:
                      raise ValueError(f"File '{TARGET_FILE}' not found!")
              else:
                  target = files[0]

              file_id = target.get("id")
              file_name = target.get("name")
              print(f"Selected: {file_name}")

              # Get download URL
              print("Getting download URL...")
              file_detail = await client.offline_download(file_id)
              
              # Try to extract download URL
              download_url = None
              if isinstance(file_detail, dict):
                  medias = file_detail.get("medias", [])
                  if medias and len(medias) > 0:
                      download_url = medias[0].get("link", {}).get("url")
                  if not download_url:
                      download_url = file_detail.get("web_content_link")
              
              if not download_url:
                  # Fallback: try path API
                  print("Trying path API...")
                  path_info = await client.file_get_path(file_id)
                  if isinstance(path_info, list) and len(path_info) > 0:
                      download_url = path_info[0].get("url")
                  elif isinstance(path_info, dict):
                      download_url = path_info.get("url")

              if not download_url:
                  raise Exception("Could not get download URL!")

              print(f"Downloading from URL...")
              async with aiohttp.ClientSession() as session:
                  async with session.get(download_url) as response:
                      if response.status == 200:
                          save_path = DOWNLOAD_DIR / file_name
                          with open(save_path, "wb") as f:
                              async for chunk in response.content.iter_chunked(8192):
                                  f.write(chunk)
                          size = save_path.stat().st_size
                          print(f"Downloaded: {save_path} ({size} bytes)")
                      else:
                          raise Exception(f"Download failed: HTTP {response.status}")

          if __name__ == "__main__":
              asyncio.run(download_from_pikpak())
          EOF
          python download.py
      
      - name: Upload downloaded files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloaded-files
          path: ./downloads/
          retention-days: 7
